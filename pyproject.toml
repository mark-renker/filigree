[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "filigree"
version = "0.1.0"
description = "A text language for fast ideation of intricate musical expression and harmony (MPE)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Filigree" }]
keywords = ["midi", "mpe", "music", "dsl", "composition"]
classifiers = [
  "Programming Language :: Python :: 3.11",
  "Topic :: Multimedia :: Sound/Audio :: MIDI",
]
dependencies = [
  "numpy>=1.24",
  "mido>=1.3",
]

[project.optional-dependencies]
realtime = ["python-rtmidi>=1.5"]
dev = ["pytest>=7"]

[project.scripts]
filigree = "filigree.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["filigree*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
